nelmio_cors:
    defaults:
        origin_regex: true
        allow_credentials: false
        allow_origin: [ '%env(ALLOWED_ORIGINS)%' ]
        allow_headers: [ 'Content-Type', 'Accept' ]
        allow_methods: [ 'GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS' ]
        max_age: 3600
    paths:
        '^/api/': ~
