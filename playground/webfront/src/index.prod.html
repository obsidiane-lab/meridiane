<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <!--
      [[- $nonce := randAlphaNum 32 -]]
      [[- $csp := printf "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; manifest-src 'self'; object-src 'none'; script-src 'self' 'nonce-%s'; script-src-attr 'none'; style-src 'self' 'nonce-%s'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; worker-src 'none'" $nonce $nonce -]]
      [[- .RespHeader.Set "Content-Security-Policy" $csp -]]
      [[- .RespHeader.Set "Cache-Control" "no-store" -]]
    -->
    <meta charset="utf-8" />
    <title>Meridiane</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>

  <body class="bg-background selection:bg-primary selection:text-primary-foreground">
    <app-root ngCspNonce="[[ $nonce ]]">
      <div class="flex h-screen">
        <div class="m-auto">
          <div
            class="inline-flex items-center rounded-md bg-primary px-4 py-2 text-sm leading-6 font-semibold text-primary-foreground shadow-sm"
            role="status"
            aria-live="polite"
            aria-atomic="true">
            <svg
              class="mr-3 -ml-1 size-5 animate-spin"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
            </svg>
            Chargement...
          </div>
        </div>
      </div>
    </app-root>
  </body>
</html>
