<header class="flex items-start justify-between gap-4">
  <div class="flex min-w-0 flex-col gap-1">
    @if (headingLevel() === 1) {
      <h1 class="text-xl font-semibold tracking-tight text-foreground lg:text-2xl">{{ title() }}</h1>
    } @else {
      <h2 class="text-lg font-semibold tracking-tight text-foreground lg:text-xl">{{ title() }}</h2>
    }
    @if (description(); as descriptionText) {
      <p class="max-w-3xl text-sm text-muted-foreground">{{ descriptionText }}</p>
    }
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <ng-content />
  </div>
</header>
