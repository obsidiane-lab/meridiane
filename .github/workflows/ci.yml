name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime tests
        run: npm -w packages/meridiane test

      - name: CLI help
        run: node packages/meridiane/cli.js --help

      - name: CLI dev help
        run: node packages/meridiane/cli.js dev --help

      - name: CLI build help
        run: node packages/meridiane/cli.js build --help

      - name: Bridge and entity models smoke build
        run: node packages/meridiane/cli.js build @obsidiane/ci-bridge --version 3.0.0 --spec packages/meridiane/test/fixtures/entity-first.openapi.json

      - name: Pack check
        run: npm -w packages/meridiane run pack:check
