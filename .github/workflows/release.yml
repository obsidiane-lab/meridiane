name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish (for example 2.0.11); leave empty to create the next version"
        required: false
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag & publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Calculate next tag
        id: tag_version
        if: github.ref_type != 'tag' && inputs.release_tag == ''
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          dry_run: true
          release_branches: master
          tag_prefix: ""
          default_bump: patch

      - name: Resolve release tag
        env:
          GENERATED_TAG: ${{ steps.tag_version.outputs.new_tag }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            if ! git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
              echo "Unknown release tag: $REQUESTED_TAG" >&2
              exit 1
            fi
            release_tag="$REQUESTED_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$GENERATED_TAG"
          fi

          if [ -z "$release_tag" ]; then
            echo "No release tag could be resolved" >&2
            exit 1
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm whoami --registry="https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Align package metadata with release
        run: |
          cd packages/meridiane
          npm pkg set version="${RELEASE_TAG}"
          npm pkg set repository.url="git+https://github.com/obsidiane-lab/meridiane.git"

      - name: Bridge smoke build
        run: node packages/meridiane/cli.js build @obsidiane/release-check --version "${RELEASE_TAG}" --no-models

      - name: Pack check
        run: npm -w packages/meridiane run pack:check

      - name: Create release tag
        if: github.ref_type != 'tag' && inputs.release_tag == ''
        run: |
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          cd packages/meridiane
          npm publish --access public

      - name: Show release info
        run: |
          echo "Tag: ${RELEASE_TAG}"
          echo "Release type: ${{ steps.tag_version.outputs.release_type }}"
